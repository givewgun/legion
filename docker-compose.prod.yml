# Production compose for the Oracle Cloud VM. Self-contained (deploy with just
# `-f docker-compose.prod.yml`); mirrors docker-compose.yml and adds the
# cross-stack networking legion needs on the shared VM:
#
#   legion         (internal)  every legion container talks by service name
#                              (nats, ollama, api↔web, …)
#   gunvest        (external)  reach gunvest-db (Postgres) + gunvest-app (REST API)
#   tunnel-gateway (external)  cloudflared ingress shared with gunvest; serves the dashboard
#
# Every container is named `legion-*` so it's unmistakable next to the gunvest
# stack in `docker ps` on the shared VM.
#
# Only `web` sits on tunnel-gateway — it's the sole HTTP ingress. It proxies /api
# to the internal `api` service, which reads gunvest's Postgres over the `gunvest`
# network. The gunvest network name differs by compose project, so it's
# parameterised; the deploy workflow detects it and writes GUNVEST_NETWORK into .env.
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build

services:
  nats:
    image: nats:2.10-alpine
    container_name: legion-nats
    command: ['-js']
    ports:
      - '4222:4222' # host-published so `npm run kick` from the host can reach it
    restart: unless-stopped
    networks: [legion]

  ollama:
    image: ollama/ollama:latest
    container_name: legion-ollama
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks: [legion]

  emitter:
    build: .
    container_name: legion-emitter
    command: npm run emitter
    env_file: .env
    depends_on: [nats]
    restart: unless-stopped
    networks: [legion, gunvest]

  agent-technical:
    build: .
    container_name: legion-agent-technical
    command: npm run agent:technical
    env_file: .env
    depends_on: [nats, ollama]
    restart: unless-stopped
    networks: [legion, gunvest]

  agent-news:
    build: .
    container_name: legion-agent-news
    command: npm run agent:news
    env_file: .env
    depends_on: [nats, ollama]
    restart: unless-stopped
    networks: [legion, gunvest]

  agent-social:
    build: .
    container_name: legion-agent-social
    command: npm run agent:social
    env_file: .env
    depends_on: [nats, ollama]
    restart: unless-stopped
    networks: [legion, gunvest]

  agent-contrarian:
    build: .
    container_name: legion-agent-contrarian
    command: npm run agent:contrarian
    env_file: .env
    depends_on: [nats, ollama]
    restart: unless-stopped
    networks: [legion, gunvest]

  risk:
    build: .
    container_name: legion-risk
    command: npm run risk
    env_file: .env
    depends_on: [nats]
    restart: unless-stopped
    networks: [legion, gunvest]

  scheduler:
    build: .
    container_name: legion-scheduler
    command: npm run scheduler
    env_file: .env
    depends_on: [nats]
    restart: unless-stopped
    networks: [legion, gunvest]

  # Dashboard REST API. Reads gunvest's Postgres (legion schema); no host port —
  # only the web service (same legion network) talks to it.
  api:
    build: .
    container_name: legion-api
    command: npm run api
    env_file: .env
    expose: ['8088']
    depends_on: [nats]
    restart: unless-stopped
    networks: [legion, gunvest]

  # Dashboard SPA (vite preview). Sole tunnel ingress; proxies /api to `api`.
  web:
    build: ./web
    container_name: legion-web
    command: npm run preview -- --host --port 5174
    environment:
      LEGION_API_PROXY: http://api:8088
    expose: ['5174']
    depends_on: [api]
    restart: unless-stopped
    networks: [legion, tunnel-gateway]

volumes:
  ollama-data:

networks:
  legion:
    driver: bridge
  gunvest:
    external: true
    name: ${GUNVEST_NETWORK:-gunvest_default}
  tunnel-gateway:
    external: true
