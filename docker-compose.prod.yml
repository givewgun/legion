# Production compose for the Oracle Cloud VM. Self-contained (deploy with just
# `-f docker-compose.prod.yml`); mirrors docker-compose.yml and adds the
# cross-stack networking legion needs on the shared VM:
#
#   legion         (internal)  every legion container talks by service name
#                              (nats, ollama, api↔web, …)
#   gunvest        (external)  reach gunvest-db (Postgres) + gunvest-app (REST API)
#   tunnel-gateway (external)  cloudflared ingress shared with gunvest; serves the dashboard
#
# Every container is named `legion-*` so it's unmistakable next to the gunvest
# stack in `docker ps` on the shared VM.
#
# Only `web` sits on tunnel-gateway — it's the sole HTTP ingress. It proxies /api
# to the internal `api` service, which reads gunvest's Postgres over the `gunvest`
# network. The gunvest network name differs by compose project, so it's
# parameterised; the deploy workflow detects it and writes GUNVEST_NETWORK into .env.
#
# Oculory observability: every worker process starts with
# `node --import ./src/instrumentation/otel.mjs`, which exposes Prometheus metrics
# on :9100 and ships OTLP traces to oculory-alloy. NATS publishes monitoring on
# :8222 for the nats-exporter.
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build

# Shared OTel env for every instrumented Node worker.
x-otel-env: &otel-env
  OTEL_SERVICE_NAME: legion
  OTEL_EXPORTER_OTLP_ENDPOINT: http://oculory-alloy:4317

services:
  nats:
    image: nats:2.10-alpine
    container_name: legion-nats
    # -m 8222 exposes the HTTP monitoring endpoint scraped by Oculory's nats-exporter.
    command: ['-js', '-m', '8222']
    ports:
      - '4222:4222' # host-published so `npm run kick` from the host can reach it
    expose:
      - '8222'
    restart: unless-stopped
    networks: [legion]
    environment:
      - TZ=Asia/Bangkok

  ollama:
    image: ollama/ollama:latest
    container_name: legion-ollama
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      # 30m (not -1): long-lived runners leak memory across sweeps (~1GB/cycle,
      # never freed). 30m keeps the model warm for a whole serialized sweep
      # (calls are back-to-back), then unloads to reclaim everything between
      # the 4h cycles. See ADR 0005 amendment.
      - OLLAMA_KEEP_ALIVE=30m
      - TZ=Asia/Bangkok
    restart: unless-stopped
    # Hard cap as backstop: kernel reclaims page cache under pressure, and a
    # runaway runner gets OOM-killed and restarted instead of starving the
    # gunvest stack on the shared VM. Oracle cut the free tier to 12GB total
    # (2026), so the cap must leave room for the rest of the box: base
    # footprint ~2.6GB + qwen2.5:7b (~5.5GB loaded) fits in 7g with headroom.
    mem_limit: 7g
    networks: [legion]

  emitter:
    build: .
    container_name: legion-emitter
    command: node --import=./src/instrumentation/otel.mjs src/run/emitter.js
    env_file: .env
    environment:
      <<: *otel-env
      TZ: Asia/Bangkok
    expose: ['9100']
    depends_on: [nats]
    restart: unless-stopped
    networks: [legion, gunvest]

  agent-technical:
    build: .
    container_name: legion-agent-technical
    command: node --import=./src/instrumentation/otel.mjs src/run/agent-technical.js
    env_file: .env
    environment:
      <<: *otel-env
      TZ: Asia/Bangkok
    expose: ['9100']
    depends_on: [nats, ollama]
    restart: unless-stopped
    networks: [legion, gunvest]

  agent-news:
    build: .
    container_name: legion-agent-news
    command: node --import=./src/instrumentation/otel.mjs src/run/agent-news.js
    env_file: .env
    environment:
      <<: *otel-env
      TZ: Asia/Bangkok
    expose: ['9100']
    depends_on: [nats, ollama]
    restart: unless-stopped
    networks: [legion, gunvest]

  agent-social:
    build: .
    container_name: legion-agent-social
    command: node --import=./src/instrumentation/otel.mjs src/run/agent-social.js
    env_file: .env
    environment:
      <<: *otel-env
      TZ: Asia/Bangkok
    expose: ['9100']
    depends_on: [nats, ollama]
    restart: unless-stopped
    networks: [legion, gunvest]

  agent-contrarian:
    build: .
    container_name: legion-agent-contrarian
    command: node --import=./src/instrumentation/otel.mjs src/run/agent-contrarian.js
    env_file: .env
    environment:
      <<: *otel-env
      TZ: Asia/Bangkok
    expose: ['9100']
    depends_on: [nats, ollama]
    restart: unless-stopped
    networks: [legion, gunvest]

  risk:
    build: .
    container_name: legion-risk
    command: node --import=./src/instrumentation/otel.mjs src/run/risk.js
    env_file: .env
    environment:
      <<: *otel-env
      TZ: Asia/Bangkok
    expose: ['9100']
    depends_on: [nats]
    restart: unless-stopped
    networks: [legion, gunvest]

  scheduler:
    build: .
    container_name: legion-scheduler
    command: node --import=./src/instrumentation/otel.mjs src/run/scheduler.js
    env_file: .env
    environment:
      <<: *otel-env
      TZ: Asia/Bangkok
    expose: ['9100']
    depends_on: [nats]
    restart: unless-stopped
    networks: [legion, gunvest]

  # Dashboard REST API. Reads gunvest's Postgres (legion schema); no host port —
  # only the web service (same legion network) talks to it. :9100 = metrics.
  api:
    build: .
    container_name: legion-api
    command: node --import=./src/instrumentation/otel.mjs src/run/api.js
    env_file: .env
    expose: ['8088', '9100']
    environment:
      <<: *otel-env
      TZ: Asia/Bangkok
    depends_on: [nats]
    restart: unless-stopped
    networks: [legion, gunvest]

  # Long-lived cron (ADR 0026 self-learning): resolves due signals against
  # forward/benchmark returns, recomputes each agent's reliability ρ and vote
  # correlations, and (when LEGION_REFLECTION=true) distills misses into lessons.
  # Reads gunvest Postgres + the gunvest REST API, so it needs the gunvest network;
  # reflection uses the local Ollama provider. Without this service the entire
  # reliability pipeline never runs and agent_reliability stays empty.
  reliability:
    build: .
    container_name: legion-reliability
    command: node --import=./src/instrumentation/otel.mjs src/run/reliability.js
    env_file: .env
    environment:
      <<: *otel-env
      TZ: Asia/Bangkok
    expose: ['9100']
    depends_on: [ollama]
    restart: unless-stopped
    networks: [legion, gunvest]

  # Long-lived cron: sends the periodic Telegram digest of the window's signals.
  # Reads gunvest Postgres for the signal history.
  summary:
    build: .
    container_name: legion-summary
    command: node --import=./src/instrumentation/otel.mjs src/run/summary.js
    env_file: .env
    environment:
      <<: *otel-env
      TZ: Asia/Bangkok
    expose: ['9100']
    restart: unless-stopped
    networks: [legion, gunvest]

  # Dashboard SPA served by nginx. Sole tunnel ingress; proxies /api to `api`.
  web:
    build: ./web
    container_name: legion-web
    environment:
      TZ: Asia/Bangkok
    expose: ['5174']
    depends_on: [api]
    restart: unless-stopped
    networks: [legion, tunnel-gateway]

volumes:
  ollama-data:

networks:
  legion:
    driver: bridge
  gunvest:
    external: true
    name: ${GUNVEST_NETWORK:-gunvest_default}
  tunnel-gateway:
    external: true
