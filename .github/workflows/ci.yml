name: Legion CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual run = verify → docker → deploy

concurrency:
  # Separate by event so a push can't cancel an in-flight manual deploy run.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Needed by the test-reporter (check runs) and coverage-report (PR comment) actions.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Exposed to the `badges` job so it can rewrite the README without re-running
    # the suite. tests = <testcase> count in the JUnit report; cov = line %.
    outputs:
      tests: ${{ steps.stats.outputs.tests }}
      cov: ${{ steps.stats.outputs.cov }}

    # Legion's unit tests are infra-free, but db:migrate needs a real Postgres to
    # validate schema.sql against. Reuse the same gunvest database name the app
    # defaults to so DATABASE_URL matches .env.example.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gunvest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/gunvest
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Migrate schema (validates schema.sql + db client)
        run: npm run db:migrate
      - name: Test (coverage + junit)
        run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile=reports/junit.xml
      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend tests
          path: reports/junit.xml
          reporter: java-junit
      - name: Coverage comment
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Backend
      - name: Collect badge stats
        id: stats
        if: always()
        run: |
          echo "tests=$(grep -c '<testcase' reports/junit.xml)" >> "$GITHUB_OUTPUT"
          echo "cov=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")" >> "$GITHUB_OUTPUT"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tests: ${{ steps.stats.outputs.tests }}
      cov: ${{ steps.stats.outputs.cov }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Build dashboard
        run: npm run build
      - name: Test (coverage + junit)
        run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile=reports/junit.xml
      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Dashboard tests
          path: web/reports/junit.xml
          reporter: java-junit
      - name: Coverage comment
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Dashboard
          json-summary-path: ./web/coverage/coverage-summary.json
          json-final-path: ./web/coverage/coverage-final.json
      - name: Collect badge stats
        id: stats
        if: always()
        run: |
          echo "tests=$(grep -c '<testcase' reports/junit.xml)" >> "$GITHUB_OUTPUT"
          echo "cov=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")" >> "$GITHUB_OUTPUT"

  # Rewrites the auto-maintained README badge + stats blocks from the test/coverage
  # numbers the verify and web jobs just produced, and commits the result. Runs only
  # on direct pushes to main (not PRs/forks) where contents:write + push are allowed.
  # badges:
  #   runs-on: ubuntu-latest
  #   needs: [verify, web]
  #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  #   permissions:
  #     contents: write
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: '20'
  #     - name: Regenerate README badges
  #       env:
  #         TESTS_BACKEND: ${{ needs.verify.outputs.tests }}
  #         TESTS_WEB: ${{ needs.web.outputs.tests }}
  #         COV_BACKEND: ${{ needs.verify.outputs.cov }}
  #         COV_WEB: ${{ needs.web.outputs.cov }}
  #       run: node scripts/update-badges.mjs
  #     - name: Commit if changed
  #       run: |
  #         if git diff --quiet -- README.md; then
  #           echo "Badges already current."
  #           exit 0
  #         fi
  #         git config user.name "github-actions[bot]"
  #         git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
  #         git add README.md
  #         git commit -m "docs: auto-update README badges [skip ci]"
  #         git push

  docker:
    runs-on: ubuntu-latest
    needs: [verify, web]
    # Build on main pushes and on any manual run (so the deploy chain has an image step).
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t legion:latest .
      - name: Build dashboard image
        run: docker build -t legion-web:latest ./web

  deploy:
    runs-on: ubuntu-latest
    needs: [verify, web, docker]
    # Manual only for now. To enable auto-deploy on every green main push, add:
    #   || github.ref == 'refs/heads/main'
    # if: github.event_name == 'workflow_dispatch'
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read # GITHUB_TOKEN is used to clone/pull the repo on the VM
    concurrency:
      group: deploy-oracle # serialize deploys; never cancel one mid-flight
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO_CLONE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          LEGION_ALLOWED_EMAILS: ${{ secrets.LEGION_ALLOWED_EMAILS }}
          LEGION_PUBLIC_URL: ${{ secrets.LEGION_PUBLIC_URL }}
          # Home PC model server (tiered local provider). Empty when unset =>
          # tiered provider stays pure-Oracle, byte-identical to before.
          HOME_OLLAMA_URL: ${{ secrets.HOME_OLLAMA_URL }}
          HOME_MODEL: ${{ secrets.HOME_MODEL }}
          HOME_THINK: ${{ secrets.HOME_THINK }}
          # HOME_FALLBACK=false pins the PC (no Oracle fallback); unset/true = tiered.
          HOME_FALLBACK: ${{ secrets.HOME_FALLBACK }}
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          port: 22
          envs: DATABASE_URL,FINNHUB_API_KEY,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,REPO_CLONE_TOKEN,GH_REPO,GOOGLE_OAUTH_CLIENT_ID,GOOGLE_OAUTH_CLIENT_SECRET,SESSION_SECRET,LEGION_ALLOWED_EMAILS,LEGION_PUBLIC_URL,HOME_OLLAMA_URL,HOME_MODEL,HOME_THINK,HOME_FALLBACK
          script: |
            set -euo pipefail
            APP_DIR=/opt/legion/app
            # qwen3:4b: a thinking model that fits the 2-OCPU/12GB free tier with
            # room to spare (~2.6GB loaded under the 7g mem_limit). Thinking is ON
            # (OLLAMA_THINK=true below): the reasoning trace is captured onto each
            # vote and quoted to peers as dissent (ADR 0033). Thinking multiplies
            # tokens per call on 2 CPU cores, so the request deadline below is
            # raised from the old 300s; calls still serialize through
            # OLLAMA_NUM_PARALLEL=1 and the twice-daily cron absorbs the latency.
            # To fall back to a non-thinking model, set MODEL=qwen2.5:7b-instruct
            # and OLLAMA_THINK= (blank omits the field — qwen2.5 rejects it).
            MODEL=qwen3:4b
            REPO_URL="https://x-access-token:${REPO_CLONE_TOKEN}@github.com/${GH_REPO}.git"

            # First-run bootstrap: clone if missing. The VM already has Docker and
            # the running gunvest stack (Postgres + REST API + tunnel-gateway net).
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo rm -rf "$APP_DIR"
              sudo mkdir -p "$(dirname "$APP_DIR")"
              sudo git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            sudo git remote set-url origin "$REPO_URL"
            sudo git fetch origin main
            sudo git reset --hard origin/main

            # Detect the docker network gunvest-db is attached to, so legion can
            # reach gunvest-db + gunvest-app by name. Falls back to gunvest_default.
            GUNVEST_NETWORK=$(sudo docker inspect \
              -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' \
              gunvest-db 2>/dev/null | head -n1 || true)
            GUNVEST_NETWORK=${GUNVEST_NETWORK:-gunvest_default}
            echo "Using gunvest network: ${GUNVEST_NETWORK}"

            # Generate .env from GitHub Secrets (the source of truth) each deploy.
            # gunvest-db / gunvest-app resolve over the shared GUNVEST_NETWORK.
            sudo tee .env > /dev/null <<EOF
            GUNVEST_NETWORK=${GUNVEST_NETWORK}
            NATS_URL=nats://nats:4222
            OLLAMA_URL=http://ollama:11434
            OLLAMA_MODEL=${MODEL}
            OLLAMA_THINK=true
            OLLAMA_TIMEOUT_MS=900000
            OLLAMA_MAX_CONCURRENT=1
            HOME_OLLAMA_URL=${HOME_OLLAMA_URL}
            HOME_MODEL=${HOME_MODEL}
            HOME_THINK=${HOME_THINK}
            HOME_FALLBACK=${HOME_FALLBACK}
            DATABASE_URL=${DATABASE_URL}
            GUNVEST_API_URL=http://gunvest-app:3001
            FINNHUB_API_KEY=${FINNHUB_API_KEY}
            TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
            TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
            LEGION_EXPECTED_AGENTS=4
            LEGION_RISK_ENABLED=true
            LEGION_CRON=0 11,17 * * 1-5
            LEGION_REFLECTION=true
            NODE_ENV=production
            GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
            GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
            SESSION_SECRET=${SESSION_SECRET}
            LEGION_ALLOWED_EMAILS=${LEGION_ALLOWED_EMAILS}
            LEGION_PUBLIC_URL=${LEGION_PUBLIC_URL}
            EOF
            sudo chmod 600 .env

            COMPOSE="sudo docker compose -f docker-compose.prod.yml --env-file .env"

            # Start infra first so the model pull and migration have a target.
            $COMPOSE up -d --build nats ollama

            # Pull the agents' model once (multi-GB; skip if already present).
            if ! sudo docker exec legion-ollama ollama list | grep -q "$MODEL"; then
              sudo docker exec legion-ollama ollama pull "$MODEL"
            fi

            # Build the app image from the freshly-checked-out code BEFORE migrating.
            # `compose run` reuses an existing image and does not rebuild, so without
            # this the migration would run the PREVIOUS deploy's schema.sql and miss
            # new DDL (e.g. added columns), leaving new code pointed at a stale schema.
            $COMPOSE build
            # Apply the legion schema (idempotent), then start the app processes.
            $COMPOSE run --rm --no-deps risk npm run db:migrate
            $COMPOSE up -d --build

            sudo docker system prune -f
            echo "Deploy complete at $(date)"
