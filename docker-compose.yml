services:
  nats:
    image: nats:2.10-alpine
    container_name: legion-nats
    command: ['-js']
    ports:
      - '4222:4222'
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: legion-ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  emitter:
    build: .
    command: npm run emitter
    env_file: .env
    depends_on: [nats]
    restart: unless-stopped

  agent-technical:
    build: .
    command: npm run agent:technical
    env_file: .env
    depends_on: [nats, ollama]
    restart: unless-stopped

  agent-news:
    build: .
    command: npm run agent:news
    env_file: .env
    depends_on: [nats, ollama]
    restart: unless-stopped

  agent-social:
    build: .
    command: npm run agent:social
    env_file: .env
    depends_on: [nats, ollama]
    restart: unless-stopped

  agent-contrarian:
    build: .
    command: npm run agent:contrarian
    env_file: .env
    depends_on: [nats, ollama]
    restart: unless-stopped

  risk:
    build: .
    command: npm run risk
    env_file: .env
    depends_on: [nats]
    restart: unless-stopped

  scheduler:
    build: .
    command: npm run scheduler
    env_file: .env
    depends_on: [nats]
    restart: unless-stopped

  api:
    build: .
    command: npm run api
    env_file: .env
    ports: ['8088:8088']
    depends_on: [nats]
    restart: unless-stopped

  web:
    build: ./web
    command: npm run preview -- --host --port 5174
    ports: ['5174:5174']
    depends_on: [api]
    restart: unless-stopped

volumes:
  ollama-data:
