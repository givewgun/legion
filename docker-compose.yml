services:
  nats:
    image: nats:2.10-alpine
    container_name: legion-nats
    command: ['-js']
    ports:
      - '4222:4222'
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: legion-ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      # 30m (not -1): warm for a whole sweep, unloads between cycles so
      # runner memory growth can't accumulate. See ADR 0005 amendment.
      - OLLAMA_KEEP_ALIVE=30m
    restart: unless-stopped

  emitter:
    build: .
    container_name: legion-emitter
    command: npm run emitter
    env_file: .env
    depends_on: [nats]
    restart: unless-stopped

  agent-technical:
    build: .
    container_name: legion-agent-technical
    command: npm run agent:technical
    env_file: .env
    depends_on: [nats, ollama]
    restart: unless-stopped

  agent-news:
    build: .
    container_name: legion-agent-news
    command: npm run agent:news
    env_file: .env
    depends_on: [nats, ollama]
    restart: unless-stopped

  agent-social:
    build: .
    container_name: legion-agent-social
    command: npm run agent:social
    env_file: .env
    depends_on: [nats, ollama]
    restart: unless-stopped

  agent-contrarian:
    build: .
    container_name: legion-agent-contrarian
    command: npm run agent:contrarian
    env_file: .env
    depends_on: [nats, ollama]
    restart: unless-stopped

  risk:
    build: .
    container_name: legion-risk
    command: npm run risk
    env_file: .env
    depends_on: [nats]
    restart: unless-stopped

  scheduler:
    build: .
    container_name: legion-scheduler
    command: npm run scheduler
    env_file: .env
    depends_on: [nats]
    restart: unless-stopped

  api:
    build: .
    container_name: legion-api
    command: npm run api
    env_file: .env
    ports: ['8088:8088']
    depends_on: [nats]
    restart: unless-stopped

  # Long-lived cron: resolves due signals and recomputes agent reliability ρ.
  # The one-shot backtest is run on demand: docker compose run --rm reliability npm run backtest
  reliability:
    build: .
    container_name: legion-reliability
    command: npm run reliability
    env_file: .env
    restart: unless-stopped

  # Long-lived cron: sends the periodic Telegram digest of the window's signals.
  summary:
    build: .
    container_name: legion-summary
    command: npm run summary
    env_file: .env
    restart: unless-stopped

  # IBKR Client Portal gateway (ADR 0035): authenticates the paper account and
  # exposes the REST API the broker adapter (src/broker/ibkr.js) talks to.
  # Credentials come from .env.ibeam (IBEAM_ACCOUNT / IBEAM_PASSWORD, not
  # committed — see .gitignore); legion .env points IBKR_GATEWAY_URL at it.
  ibeam:
    image: voyz/ibeam:latest
    container_name: legion-ibeam
    env_file: .env.ibeam
    restart: unless-stopped

  web:
    build: ./web
    container_name: legion-web
    command: npm run preview -- --host --port 5174
    # Inside the compose network /api must reach the api service, not localhost.
    environment:
      LEGION_API_PROXY: http://api:8088
    ports: ['5174:5174']
    depends_on: [api]
    restart: unless-stopped

volumes:
  ollama-data:
